<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>MaestrIA — Autorisation</title>
<!--
  Page d'autorisation de MaestrIA (étape 11, serveur MCP).
  Supabase Auth y envoie Claude quand il demande l'accès aux tâches :
  Raphaël se connecte avec un code reçu par e-mail, puis autorise ou refuse.
  Les adresses du projet sont dans config.js (copie de config.example.js, ignorée par Git).
-->
<style>
  :root {
    --bg: #F5F6F8; --card: #FFFFFF; --text: #111827; --muted: #4B5563; --border: #E2E5EA;
    --accent: #2F5BEA; --on-accent: #FFFFFF; --danger: #B91C1C;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111318; --card: #1B1E25; --text: #F3F4F6; --muted: #A7ADB8; --border: #2C313B;
            --accent: #5B7FFF; --on-accent: #0B1020; --danger: #F87171; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
         background: var(--bg); color: var(--text); font: 16px/1.5 Inter, -apple-system, system-ui, sans-serif; }
  main { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--border);
         border-radius: 16px; padding: 28px 24px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p { margin: 8px 0; color: var(--muted); }
  label { display: block; font-size: 14px; color: var(--muted); margin: 16px 0 6px; }
  input { width: 100%; min-height: 44px; padding: 10px 12px; font: inherit; color: var(--text);
          background: var(--bg); border: 1px solid var(--border); border-radius: 10px; }
  button { min-height: 44px; padding: 10px 16px; font: inherit; font-weight: 600; border-radius: 10px;
           border: 1px solid var(--border); background: transparent; color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  button:disabled { opacity: 0.5; cursor: default; }
  .actions { display: flex; gap: 8px; margin-top: 20px; }
  .actions button { flex: 1; }
  ul { padding-left: 20px; color: var(--muted); }
  .error { color: var(--danger); font-size: 14px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>MaestrIA</h1>

  <section id="login" hidden>
    <p>Connectez-vous pour autoriser l'accès à vos tâches.</p>
    <form id="email-form">
      <label for="email">Adresse e-mail</label>
      <input id="email" type="email" autocomplete="email" required>
      <div class="actions"><button class="primary" type="submit">Recevoir un code</button></div>
    </form>
    <form id="code-form" hidden>
      <label for="code">Code reçu par e-mail</label>
      <input id="code" inputmode="numeric" autocomplete="one-time-code" required>
      <div class="actions"><button class="primary" type="submit">Se connecter</button></div>
    </form>
  </section>

  <section id="consent" hidden>
    <p><strong id="client-name">Claude</strong> demande l'accès à vos tâches MaestrIA. Il pourra :</p>
    <ul>
      <li>lire vos listes et vos tâches ;</li>
      <li>créer, modifier, terminer, replanifier et supprimer des tâches (chaque action est notée et peut être annulée).</li>
    </ul>
    <p id="redirect-host"></p>
    <div class="actions">
      <button id="deny" type="button">Refuser</button>
      <button id="approve" class="primary" type="button">Autoriser</button>
    </div>
  </section>

  <p id="status" role="status"></p>
  <p id="error" class="error" role="alert"></p>
</main>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const show = (id) => { for (const s of ["login", "consent"]) $(s).hidden = s !== id; };
  const status = (text) => { $("status").textContent = text; };
  const fail = (text) => { $("error").textContent = text; };

  const authorizationId = new URLSearchParams(location.search).get("authorization_id");
  const config = window.MAESTRIA_CONFIG;
  if (!config) {
    fail("Page mal installée : config.js manquant.");
  } else if (!authorizationId) {
    fail("Lien incomplet : cette page s'ouvre depuis Claude, au moment de connecter MaestrIA.");
  } else {
    const client = supabase.createClient(config.supabaseUrl, config.supabaseAnonKey);
    let email = "";

    async function showConsent() {
      fail("");
      status("Chargement…");
      const { data, error } = await client.auth.oauth.getAuthorizationDetails(authorizationId);
      status("");
      if (error) return fail(`Demande introuvable ou expirée (${error.message}). Recommencez depuis Claude.`);
      // Accès déjà accordé : on repart directement vers Claude.
      if (data.redirect_url && !data.authorization_id) return location.assign(data.redirect_url);
      $("client-name").textContent = data.client?.name || "Une application";
      try {
        $("redirect-host").textContent = `Retour vers : ${new URL(data.redirect_uri).host}`;
      } catch { /* adresse illisible : rien à afficher */ }
      show("consent");
    }

    async function decide(approve) {
      $("approve").disabled = $("deny").disabled = true;
      const { data, error } = approve
        ? await client.auth.oauth.approveAuthorization(authorizationId, { skipBrowserRedirect: true })
        : await client.auth.oauth.denyAuthorization(authorizationId, { skipBrowserRedirect: true });
      if (error) {
        $("approve").disabled = $("deny").disabled = false;
        return fail(error.message);
      }
      status(approve ? "Accès autorisé, retour vers Claude…" : "Accès refusé, retour vers Claude…");
      location.assign(data.redirect_url);
    }

    $("email-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      fail("");
      email = $("email").value.trim();
      const { error } = await client.auth.signInWithOtp({ email, options: { shouldCreateUser: false } });
      if (error) return fail(error.message);
      $("email-form").hidden = true;
      $("code-form").hidden = false;
      $("code").focus();
      status("Code envoyé : regardez vos e-mails.");
    });

    $("code-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      fail("");
      const { error } = await client.auth.verifyOtp({ email, token: $("code").value.trim(), type: "email" });
      if (error) return fail("Code incorrect ou expiré.");
      status("");
      await showConsent();
    });

    $("approve").addEventListener("click", () => decide(true));
    $("deny").addEventListener("click", () => decide(false));

    client.auth.getSession().then(({ data }) => (data.session ? showConsent() : show("login")));
  }
</script>
</body>
</html>
